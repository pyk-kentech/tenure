[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenure"
version = "0.2.0"
description = "Claude Code와 Codex CLI가 설계를 토론하고 서로의 코드를 교차 리뷰하는 로컬 CLI 도구"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# pywinpty: Windows 의 ConPTY 로 대화형 터미널 세션을 띄운다 (M34, DESIGN.md 36.19). 다른 OS 는 표준 pty.
dependencies = ["pywinpty>=2.0; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# 데스크톱 앱의 엔진 sidecar 를 얼리는 빌드 도구 (M35, DESIGN.md 36.20). 실행에는 필요 없다.
desktop = ["pyinstaller>=6.10"]

[project.scripts]
tenure = "tenure.cli:main"
duet = "tenure.cli:main"     # 옛 이름 별칭 (DESIGN.md 36.11)

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tenure = ["templates/*.md", "workflows/*.toml", "bench_suites/**/*"]
"tenure.ui" = ["static/*", "static/fonts/*", "static/logos/*", "web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 벤치마크 참조 구현 안의 테스트(과제의 일부)는 모으지 않는다
norecursedirs = ["bench_refs", "fake_bin", ".*", "__pycache__"]
